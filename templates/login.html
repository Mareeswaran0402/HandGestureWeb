<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Hand Gesture to Words</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #07111f,
                    #10243a
                );

            color: white;

            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;

            background: #0e1d2e;

            border: 1px solid #29435f;

            border-radius: 18px;

            padding: 35px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.35);
        }

        .logo {
            text-align: center;

            margin-bottom: 25px;
        }

        .logo-icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 15px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #2f80ed;

            font-size: 32px;
        }

        h1 {
            text-align: center;

            font-size: 30px;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #9eb3ca;

            font-size: 14px;

            margin-bottom: 28px;
        }

        .message {
            padding: 12px 14px;

            border-radius: 8px;

            margin-bottom: 18px;

            font-size: 14px;
        }

        .message.error {
            background: #421f24;

            border: 1px solid #7d3942;

            color: #ffb7be;
        }

        .message.success {
            background: #183c2c;

            border: 1px solid #2d7856;

            color: #a8f0c8;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #d8e4f1;

            font-weight: 600;

            font-size: 14px;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border-radius: 9px;

            border: 1px solid #36526d;

            background: #071523;

            color: white;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #2f80ed;

            box-shadow:
                0 0 0 3px
                rgba(47, 128, 237, 0.15);
        }

        .login-btn {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #2f80ed;

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 5px;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .register-link {
            text-align: center;

            margin-top: 22px;

            color: #9eb3ca;

            font-size: 14px;
        }

        .register-link a {
            color: #5ba3ff;

            text-decoration: none;

            font-weight: 700;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;

            color: #6f849a;

            font-size: 12px;

            margin-top: 25px;
        }

    </style>

</head>


<body>

    <div class="login-container">

        <div class="logo">

            <div class="logo-icon">
                ✋
            </div>

            <h1>
                Hand Gesture
            </h1>

            <div class="subtitle">
                Sign in to your account
            </div>

        </div>


        <!-- Flask flash messages -->

        {% with messages = get_flashed_messages(
            with_categories=true
        ) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="message {{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- Login Form -->

        <form method="POST"
              action="{{ url_for('login') }}">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                    autocomplete="email"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>

        </form>


        <div class="register-link">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Create an account
            </a>

        </div>


        <div class="footer">

            Hand Gesture Recognition System

        </div>

    </div>

</body>

</html>
